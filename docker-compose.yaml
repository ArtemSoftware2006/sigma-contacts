services:
  
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    env_file: ./backend/.env 
    depends_on:
      - database
    restart: unless-stopped
    networks:
      - sigma-contacts-net

  database:
    image: mongo
    container_name: sigma-contacts-database
    restart: always
    volumes:
      - ./backend/db-data:/data/db
    ports:
      - 8081:8081
      - 27017:27017
    networks:
      - sigma-contacts-net

networks:
  sigma-contacts-net: